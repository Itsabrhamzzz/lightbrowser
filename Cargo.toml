[package]
name = "lightbrowser"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
url = "2.5.9"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wry = { version = "0.57.3", features = ["devtools"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.34"
