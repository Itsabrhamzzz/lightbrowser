<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bookmark</title>
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 320px; padding: 16px; font-family: var(--font); color: var(--text); background: var(--card-solid);
    border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; gap: 12px;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; }
  label.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
  input[type=text] {
    height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--hover);
    color: var(--text); font: inherit; font-size: 14px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
  .row small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; border-radius: 11px; background: var(--border); cursor: pointer; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 2px; }
  button {
    height: 34px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--hover);
    color: var(--text); font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { margin-right: auto; background: none; border-color: transparent; color: var(--muted); }
  button.danger:hover { color: #e5484d; }
</style>
</head>
<body>
  <h1 id="heading">Add bookmark</h1>
  <label class="field">Name<input type="text" id="name" autocomplete="off" spellcheck="false"></label>
  <div class="row">
    <div>Show only the icon<small>On the bookmarks bar</small></div>
    <label class="switch"><input type="checkbox" id="icon"><span></span></label>
  </div>
  <div class="btns">
    <button class="danger" id="remove" hidden>Remove</button>
    <button id="cancel">Cancel</button>
    <button class="primary" id="save">Save</button>
  </div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const url = q.get('url') || '';
  const saved = q.get('saved') === '1';
  const post = m => { try { window.ipc.postMessage(m); } catch (_) {} };
  $('name').value = q.get('title') || '';
  $('icon').checked = q.get('icon') === '1';
  if (saved) { $('heading').textContent = 'Edit bookmark'; $('remove').hidden = false; $('save').textContent = 'Done'; }
  const save = () => post('menu:bm:save:' + JSON.stringify({ url, title: $('name').value.trim(), icon_only: $('icon').checked }));
  $('save').onclick = save;
  $('cancel').onclick = () => post('panel:close');
  $('remove').onclick = () => post('menu:bm:unsave:' + url);
  $('name').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); save(); } });
  addEventListener('load', () => { $('name').focus(); $('name').select(); });
})();
</script>
</body>
</html>
